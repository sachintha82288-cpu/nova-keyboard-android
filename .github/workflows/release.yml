name: Release

# Builds a *signed* release APK + AAB and (re)publishes them on the GitHub release.
#
# Trigger: push a commit whose message contains [release] (or run the workflow by
# hand from the Actions tab). The job is gated so ordinary pushes only run Build.
#
# Signature: the release keystore is the one this project already publishes as a
# release asset (documented in documentation/BUILD-GUIDE.md). It is downloaded at
# build time, so no key material is committed to this repository.

on:
  push:
    branches: ["**"]
    paths-ignore: [".ci/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish onto"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_ASSET: NOVA-KEYBOARD-release-keystore.jks
      TAG: ${{ inputs.tag || 'v1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch the published release keystore
        run: |
          mkdir -p keys
          gh release download "$TAG" --pattern "$KEYSTORE_ASSET" --dir keys
          ls -l keys

      - name: Configure signing
        run: |
          PASS='${{ secrets.NOVA_STORE_PASSWORD }}'
          [ -z "$PASS" ] && PASS='NovaRelease2026'
          cat > keystore.properties <<EOF
          storeFile=keys/$KEYSTORE_ASSET
          storePassword=$PASS
          keyAlias=nova
          keyPassword=$PASS
          EOF
          keytool -list -keystore "keys/$KEYSTORE_ASSET" -storepass "$PASS" -alias nova

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Verify signature, alignment and manifest
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -4
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" | tail -2
          sha256sum "$APK" app/build/outputs/bundle/release/*.aab

      - name: Publish onto the release (replacing old artefacts)
        run: |
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --clobber
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab \
            | sed 's|app/build/outputs/[a-z]*/[a-z]*/||' > /tmp/checksums.txt
          gh release upload "$TAG" /tmp/checksums.txt --clobber

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
