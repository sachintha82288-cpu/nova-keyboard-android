name: Release

# Builds a signed release APK + AAB and attaches them to a GitHub release.
#
# Signature: the release keystore is the one this project already publishes as a
# release asset (documented in documentation/BUILD-GUIDE.md). It is downloaded at
# build time, so no key material is committed here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the artefacts to"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_ASSET: NOVA-KEYBOARD-release-keystore.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch the published release keystore
        run: |
          mkdir -p keys
          gh release download "${{ inputs.tag }}" --pattern "$KEYSTORE_ASSET" --dir keys
          ls -l keys

      - name: Configure signing
        run: |
          cat > keystore.properties <<EOF
          storeFile=keys/$KEYSTORE_ASSET
          storePassword=${{ secrets.NOVA_STORE_PASSWORD || 'NovaRelease2026' }}
          keyAlias=nova
          keyPassword=${{ secrets.NOVA_KEY_PASSWORD || 'NovaRelease2026' }}
          EOF
          # fail fast if the key does not open with these credentials
          keytool -list -keystore "keys/$KEYSTORE_ASSET" \
            -storepass "$(grep storePassword keystore.properties | cut -d= -f2)" -alias nova

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Verify the signature and the manifest
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -4
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" | tail -2
          sha256sum "$APK" app/build/outputs/bundle/release/*.aab

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
