name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/19f128dd-nova-keyboard-android }
      - name: try to push a file back
        run: |
          echo "probe write ok $(date -u)" >> ci-probe.txt
          git config user.name nova-ci; git config user.email ci@nova.local
          git add ci-probe.txt && git commit -m "ci: probe write" || true
          git push && echo PUSH_OK || echo PUSH_FAIL
