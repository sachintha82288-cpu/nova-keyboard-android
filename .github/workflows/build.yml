name: Build

# Canonical build + verification path for NOVA KEYBOARD.
# Google Maven and the Gradle distribution are not reachable from every
# environment, so a clean GitHub runner is the reference toolchain.

on:
  push:
    branches: ["**"]
    paths-ignore: [".ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/unit-tests.log

      - name: Assemble debug
        id: assemble
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/assemble.log

      - name: Publish log for the agent
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "unit tests: ${{ steps.tests.outcome }}"
            echo "assemble:   ${{ steps.assemble.outcome }}"
            echo "commit:     ${{ github.sha }}"
            echo "--- unit-tests.log ---"
            tail -n 400 /tmp/unit-tests.log 2>/dev/null || echo "(no log)"
            echo "--- assemble.log ---"
            tail -n 200 /tmp/assemble.log 2>/dev/null || echo "(no log)"
          } > .ci/last-build.log
          grep -E "^(e: |w: )" /tmp/unit-tests.log 2>/dev/null | head -40 >> .ci/last-build.log || true
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f .ci/last-build.log
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nova-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail if a step failed
        if: steps.tests.outcome != 'success' || steps.assemble.outcome == 'failure'
        run: exit 1
