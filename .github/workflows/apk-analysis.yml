name: APK Analysis

# Fetches the released APK/AAB, runs the full static-analysis toolchain on it and
# commits the report back into the repo so the report can be read without
# downloading artifacts. Triggered from a branch when .apk-analysis/run.json exists.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which released files to analyse (apk, aab, both)'
        required: false
        default: 'both'
  push:
    branches: ['**']
    paths: ['.apk-analysis/run.json']

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      TARGETS: ${{ inputs.targets || 'both' }}
      OUT: apk-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -x
          java -version
          ls "$ANDROID_HOME"/build-tools
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          "$BT/aapt2" version
          "$BT/apksigner" --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip python3-venv >/dev/null
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q androguard pyaxmlparser asn1crypto apksigtool
          /tmp/venv/bin/python -c "import androguard;print('androguard',androguard.__version__)"

      - name: Fetch release artefacts
        run: |
          mkdir -p "$OUT/bin"
          gh release download v1.0.0 --pattern '*' -D "$OUT/bin" || true
          ls -la "$OUT/bin"
          cd "$OUT/bin" && sha256sum * | tee SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published checksums
        run: |
          cd "$OUT/bin"
          exec > >(tee "../checksum-verdict.txt") 2>&1
          echo "--- files fetched ---"
          ls -la
          echo "--- checksums.txt as published in the release ---"
          cat checksums.txt 2>/dev/null || echo "(no checksums.txt in the release)"
          echo "--- checksums.txt committed in the repo at this ref ---"
          cat ../../../release/checksums.txt 2>/dev/null || echo "(none)"
          echo "--- recomputed ---"
          for f in NOVA-KEYBOARD.apk NOVA-KEYBOARD.aab; do
            [ -f "$f" ] || { echo "MISSING $f"; continue; }
            d=$(sha256sum "$f" | cut -d' ' -f1)
            echo "FILE $f $d"
            if grep -q "$d" checksums.txt 2>/dev/null; then echo "VERDICT MATCH $f"; else echo "VERDICT MISMATCH $f"; fi
          done
          exit 0

      - name: Upload raw artefacts for later re-use
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-binaries
          path: apk-analysis/bin/*.apk
          retention-days: 7

      - name: Run analysis
        run: |
          /tmp/venv/bin/python scripts/apk_analysis.py \
            --bin-dir "$OUT/bin" --out "$OUT" --aapt2 "$BUILD_TOOLS/aapt2" \
            --apksigner "$BUILD_TOOLS/apksigner" --targets "$TARGETS" 2>&1 | tail -40

      - name: Commit report back to the branch
        run: |
          set -e
          git config user.name "nova-analysis-bot"
          git config user.email "analysis@nova.local"
          rm -rf "$OUT/bin"
          printf 'shipping binaries are kept out of git\n' > "$OUT/bin/.gitkeep"
          git add -f "$OUT"
          if git diff --cached --quiet; then echo "no report changes"; exit 0; fi
          git commit -m "analysis: APK/AAB static analysis report"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q || true
            git push origin "HEAD:refs/heads/$BRANCH" && { echo PUSH_OK; exit 0; }
            sleep 10
          done
          echo PUSH_FAIL; exit 1
